version: "3.8"

volumes:
  postgres-data:

services:
  app:
    container_name: alliancedev
    hostname: codespace
    build:
      context: ..
      dockerfile: .devcontainer/dockerfile
    privileged: true
    environment:
      PORT: 3001
      DB_HOST: postgresdb
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: alliance_dev
      NODE_ENV: development
      DEV: "true"
    volumes:
      - ..:/workspaces:cached
    command: sleep infinity
    depends_on:
      - db

  db:
    container_name: postgresdb
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alliance_dev
    ports:
      - "5432:5432"
